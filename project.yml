name: LocalAI
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
targets:
  LocalAI:
    type: application
    platform: iOS
    sources:
      - path: LocalAI
    info:
      path: LocalAI/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Local AI connects to a local Ollama or LM Studio server on your network to chat with your on-device models."
        # NSAllowsArbitraryLoads (not just NSAllowsLocalNetworking): the app
        # only ever talks to the user-configured Server Address, but that
        # address can be a Tailscale CGNAT address (100.64.0.0/10), which
        # NSAllowsLocalNetworking's fixed RFC1918-only exception doesn't
        # cover, and ATS has no CIDR-scoped exception mechanism to target
        # just that range. See issue #33 for the full justification — reuse
        # it verbatim in App Store Connect's review notes if asked about
        # this at submission time.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.localai
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LocalAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocalAITests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LocalAI
schemes:
  LocalAI:
    build:
      targets:
        LocalAI: all
        LocalAITests: [test]
    test:
      targets:
        - LocalAITests
