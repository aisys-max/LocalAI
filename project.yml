name: LocalAI
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
targets:
  LocalAI:
    type: application
    platform: iOS
    sources:
      - path: LocalAI
    info:
      path: LocalAI/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.localai
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
