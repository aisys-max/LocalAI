name: LocalAI
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
targets:
  LocalAI:
    type: application
    platform: iOS
    sources:
      - path: LocalAI
    info:
      path: LocalAI/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Local AI connects to a local Ollama or LM Studio server on your network to chat with your on-device models."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.localai
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LocalAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocalAITests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LocalAI
schemes:
  LocalAI:
    build:
      targets:
        LocalAI: all
        LocalAITests: [test]
    test:
      targets:
        - LocalAITests
